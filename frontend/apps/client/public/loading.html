<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      渲染层热更切换时的过渡页（主进程在 loadFile 新层之前加载它，见 main.ts 的
      showLayerLoading）。

      约束：只用内联样式与内联脚本，不加载任何外部资源 —— 它存在的意义就是"立刻有东西
      可看"，多一次磁盘/网络请求都会把这段空窗还回去。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Vault</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        color: rgba(0, 0, 0, 0.88);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', Helvetica, Arial, sans-serif;
        /* 切换期间窗口允许拖动：用户不会因为"点不动"而以为客户端卡死。 */
        -webkit-app-region: drag;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .message {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .spinner {
        width: 20px;
        height: 20px;
        margin-top: 18px;
        border: 2px solid rgba(10, 108, 255, 0.16);
        border-top-color: #0a6cff;
        border-radius: 50%;
        animation: vault-spin 800ms linear infinite;
      }
      .hint {
        margin: 18px 0 0;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.45);
      }
      /*
        下载进度条：下载新版本期间替代转圈，给出"还剩多少"的确定感。
        没有总大小时用不确定条纹（见 .is-indeterminate），不显示假的 0%。
      */
      .progress {
        display: none;
        width: 220px;
        height: 4px;
        margin-top: 18px;
        border-radius: 999px;
        background: rgba(10, 108, 255, 0.14);
        overflow: hidden;
      }
      .progress.is-on {
        display: block;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #0a6cff;
        transition: width 240ms ease-out;
      }
      .progress.is-indeterminate .progress-bar {
        width: 40%;
        transition: none;
        animation: vault-slide 1100ms ease-in-out infinite;
      }
      @keyframes vault-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes vault-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1b1f;
          color: rgba(255, 255, 255, 0.88);
        }
        .spinner {
          border-color: rgba(10, 108, 255, 0.32);
          border-top-color: #4d94ff;
        }
        .hint {
          color: rgba(255, 255, 255, 0.45);
        }
        .progress {
          background: rgba(77, 148, 255, 0.24);
        }
        .progress-bar {
          background: #4d94ff;
        }
      }
    </style>
  </head>
  <body>
    <p class="message" id="message">正在切换到新版本界面…</p>
    <div class="progress" id="progress" aria-hidden="true">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint" id="hint">完成后会自动继续，无需操作</p>
    <script>
      /*
        文案语言与 @vault/ui 的语言码一致（zh-CN / en-US / ja-JP / ko-KR）。语言由主进程
        从客户端配置里读出来、以 ?lang= 传进来；读不到或不认识时保持 HTML 里的中文默认值，
        因此关掉脚本（或脚本出错）时这一页也不会是空白。
      */
      var TEXT = {
        'zh-CN': { message: '正在切换到新版本界面…', hint: '完成后会自动继续，无需操作' },
        'en-US': {
          message: 'Switching to the new interface…',
          hint: 'It continues on its own — no action needed.'
        },
        'ja-JP': { message: '新しい画面に切り替えています…', hint: 'そのまま自動で続行します。' },
        'ko-KR': { message: '새 화면으로 전환하는 중…', hint: '곧 자동으로 이어집니다.' }
      };
      var lang = 'zh-CN';
      try {
        lang = new URLSearchParams(window.location.search).get('lang') || 'zh-CN';
      } catch (error) {
        lang = 'zh-CN';
      }
      var text = TEXT[lang] || TEXT['zh-CN'];
      document.documentElement.lang = TEXT[lang] ? lang : 'zh-CN';
      document.getElementById('message').textContent = text.message;
      document.getElementById('hint').textContent = text.hint;

      /*
        启动期更新门的文案（见 electron/main.ts 的 setBootStatus）。
        主进程只传状态 key（checking / downloading / preparing / restarting）和可选的百分比，
        文案全部留在这里，四种语言一处维护。
      */
      var BOOT = {
        'zh-CN': {
          checking: '正在检查更新…',
          downloading: '正在下载新版本… {percent}%',
          preparing: '正在准备新版本…',
          restarting: '正在启动新版本…'
        },
        'en-US': {
          checking: 'Checking for updates…',
          downloading: 'Downloading the new version… {percent}%',
          preparing: 'Preparing the new version…',
          restarting: 'Starting the new version…'
        },
        'ja-JP': {
          checking: '更新を確認しています…',
          downloading: '新しいバージョンをダウンロードしています… {percent}%',
          preparing: '新しいバージョンを準備しています…',
          restarting: '新しいバージョンを起動しています…'
        },
        'ko-KR': {
          checking: '업데이트를 확인하는 중…',
          downloading: '새 버전을 내려받는 중… {percent}%',
          preparing: '새 버전을 준비하는 중…',
          restarting: '새 버전을 시작하는 중…'
        }
      };
      var progressEl = document.getElementById('progress');
      var progressBarEl = document.getElementById('progress-bar');
      var spinnerEl = document.querySelector('.spinner');
      /** 上一次画到的百分比：executeJavaScript 可能乱序到达，进度条绝不能往回缩。 */
      var lastBootPercent = 0;

      /** 有真实百分比就画实心条；拿不到总大小就画不确定条纹，不显示假的 0%。 */
      function setBootProgress(percent) {
        progressEl.classList.add('is-on');
        spinnerEl.style.display = 'none';
        if (typeof percent === 'number' && percent > 0) {
          lastBootPercent = Math.max(lastBootPercent, Math.min(100, percent));
          progressEl.classList.remove('is-indeterminate');
          progressBarEl.style.width = lastBootPercent + '%';
        } else {
          progressEl.classList.add('is-indeterminate');
          progressBarEl.style.width = '';
        }
      }

      function hideBootProgress() {
        progressEl.classList.remove('is-on', 'is-indeterminate');
        progressBarEl.style.width = '0%';
        spinnerEl.style.display = '';
      }

      window.__vaultBootStatus = function (status, percent) {
        var table = BOOT[lang] || BOOT['zh-CN'];
        var message = table[status];
        if (!message) return;
        if (typeof percent === 'number' && percent > 0) {
          message = message.replace('{percent}', String(percent));
        } else {
          // 还不知道总大小（或没有进度）：去掉占位符，别显示 “0%” 让人以为卡住了。
          message = message.replace(/\s*\{percent\}%/, '');
        }
        document.getElementById('message').textContent = message;
        /*
          下载：确定进度条（received/total，见 clientUpdate.ts 的 awaitStartupClientUpdate）。
          校验/解压：耗时但对用户不可量化，用不确定条纹顶上，避免"停在 100% 不动"。
          检查/启动：回到转圈。
        */
        if (status === 'downloading') setBootProgress(percent);
        else if (status === 'preparing') setBootProgress(null);
        else hideBootProgress();
      };
    </script>
  </body>
</html>
